# Vale configuration (`13` §5).
#
# Vale is a Go binary with no npm distribution, so — like actionlint — it is installed in CI from a
# pinned release verified by checksum rather than becoming a dependency. The repository moved from
# `errata-ai/vale` to `vale-cli/vale` (`01` §14 A31).
#
# `MinAlertLevel = error` so warnings are advice and errors fail the build. Our own rules in
# `.vale/styles/Comvivo/` are errors where `apps/docs/STYLE.md` states a rule and warnings where it
# states a preference.
StylesPath = .vale/styles
MinAlertLevel = error

Vocab = Comvivo

Packages = Microsoft, write-good

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, write-good, Comvivo

# Starlight component names and directive syntax are not prose.
TokenIgnores = (:::\w+(\[[^\]]*\])?), (<[A-Z]\w+[^>]*>), (\{[^}]*\})

# --- Microsoft rules that contradict `apps/docs/STYLE.md` --------------------------------------
# A style package is a starting point, not a verdict. Each of these is off for a stated reason.

# Demands "can't" for "cannot". Our most important sentences are about limits — "Comvivo cannot
# protect a group from the person who runs the server" — and the uncontracted form is firmer.
# Softening a statement of what the software cannot do is the one place a contraction costs
# something.
Microsoft.Contractions = NO

# Objects to spaced em dashes. Spaced em dashes are the house style and are used throughout.
Microsoft.Dashes = NO

# Wants punctuation inside quotation marks (American). We use logical punctuation, which matters
# when quoting a command or a config value: `"comvivo start".` would be wrong about the string.
Microsoft.Quotes = NO

# Written for Microsoft's products and flags ordinary technical nouns.
Microsoft.Terms = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Foreign = NO
Microsoft.Units = NO

# "We" is correct here: this project has maintainers, and "the maintainers" in every sentence reads
# as the corporate voice we are deliberately avoiding.
Microsoft.We = NO

# `STYLE.md` asks for second person throughout, which this rule objects to in headings.
Microsoft.Auto = NO

# --- write-good -------------------------------------------------------------------------------
# Its weasel-word list overlaps `Comvivo.Marketing`, which has reasons attached.
write-good.Weasel = NO
# "There is" openings are weak but not wrong, and the rule fires on sentences that read fine.
write-good.ThereIs = NO
# Fires on "it is" everywhere. Passive voice and wordiness stay as warnings, which are advice.
write-good.TooWordy = NO

[docs/plan/**]
# The plan is an engineering document for engineers and is not held to the prose rules written for
# the documentation site.
BasedOnStyles =

[apps/docs/STYLE.md]
# The style guide necessarily names the words it bans, so running the marketing and terminology
# rules over it would flag its own examples. Spelling still applies.
BasedOnStyles = Vale

[CODE_OF_CONDUCT.md]
# A verbatim upstream document. It must not be edited to satisfy a linter.
BasedOnStyles =
