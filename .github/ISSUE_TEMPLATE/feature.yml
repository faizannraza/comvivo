name: Feature request
description: Something Comvivo should be able to do.
labels: ["feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: >-
        The situation, not the solution. "Nobody remembers whose turn it is to do the bins and it
        causes an argument every week" tells us more than "add a chore rota feature", because
        there may be a better answer than the one you had in mind.
    validations: { required: true }
  - type: textarea
    id: who
    attributes:
      label: Who does this help, and when?
      description: >-
        Which member of a household, in what moment. Comvivo serves a group, so a feature that
        helps one person at another's expense is a different conversation.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Including "nothing, we just live with it".
  - type: checkboxes
    id: promises
    attributes:
      label: Protected Promises
      description: >-
        See [GOVERNANCE.md](https://github.com/faizannraza/comvivo/blob/main/GOVERNANCE.md).
      options:
        - label: >-
            This does not require telemetry, an unofficial platform client, scraping, or a way for
            one member to monitor another.
          required: true
