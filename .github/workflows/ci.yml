# The PR pipeline (`11` §3.8.2).
#
# Job set at M0: static, unit (3 shards), integration, coverage, build, node24, ci-ok. The rest of
# `11` §3.8.2 — evals-smoke, chaos-lite, bundle-size, e2e-smoke, packaging — arrives with the
# milestone that builds the thing being checked, each adding itself to `ci-ok`'s `needs`.
#
# Hardening per `08` §3.15: `permissions: {}` here, least privilege per job, every third-party
# action pinned to a full commit SHA, and no `pull_request_target`. `scripts/hygiene/check.ts`
# enforces all four, and `zizmor.yml` (M0-T12) adds the structural analysis.
name: ci

on:
  pull_request:
    # `labeled`/`unlabeled` are **not** among the defaults (`opened`, `synchronize`, `reopened`),
    # and without them the `no-changeset` waiver the `changeset` job documents could not work:
    # `scripts/release/changeset-required.ts` reads labels from `GITHUB_EVENT_PATH`, which is
    # immutable for a run and replayed verbatim on a re-run. So adding the label to a failing PR
    # neither re-triggered `ci` nor was seen by re-running the job, and the escape hatch promised
    # at `.github/PULL_REQUEST_TEMPLATE.md` in practice required pushing a new commit. Found by the
    # M0 independent review.
    #
    # `unlabeled` is here for the same reason in reverse: removing the waiver must put the check
    # back, or a label added once would exempt every later push on that PR.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a merge-queue or main run, because a required check
  # that was cancelled never reports and the queue stalls waiting for it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC
  COMVIVO_TEST_MODE: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  # Turborepo writes a colour-coded summary that is unreadable in log files.
  FORCE_COLOR: "0"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Format and fast lint
        run: pnpm run lint

      - name: Types
        run: pnpm run typecheck

      - name: Dependency boundaries
        run: pnpm run depcruise

      - name: Brand literals
        run: pnpm run brand:check

      # `names:check` was in `pnpm verify` and in no workflow, so the two had drifted apart —
      # `CLAUDE.md` §4 defines verify as "everything CI runs on a PR", and that relationship has to
      # hold in both directions. Found by the M0 independent review.
      - name: Distribution names
        run: pnpm run names:check

      - name: Native build policy
        run: pnpm run supply:check

      - name: Secret-shaped literals
        run: pnpm run secrets:check

      # actionlint has no npm distribution, so the binary is pinned by version AND verified by
      # checksum (`scripts/ci/install-actionlint.sh`). Installed before `hygiene:check`, which
      # picks it up from PATH — and which covers what actionlint does not: SHA pinning and
      # least-privilege tokens.
      - name: Install actionlint
        run: sudo scripts/ci/install-actionlint.sh /usr/local/bin

      - name: Test hygiene, snapshots and workflows
        run: pnpm run hygiene:check

      - name: Plan consistency
        run: pnpm run plan:check

  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Thresholds are whole-tree, so a shard cannot meet them — each runs a third of the files and
      # legitimately covers a third of the code. Measured: with thresholds on, all three shards
      # exit 1. The `coverage` job enforces them once, over the merged reports.
      #
      # `--reporter=blob` is passed here rather than configured, because Vitest refuses
      # `--merge-reports` while a blob reporter is in the config.
      - name: Unit tests
        env:
          COMVIVO_COVERAGE_THRESHOLDS: "off"
        run: >
          pnpm exec vitest run --project unit
          --shard=${{ matrix.shard }}/3
          --coverage
          --reporter=blob
          --outputFile.blob=reports/vitest/blob-unit-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-unit-${{ matrix.shard }}
          # Non-hidden on purpose. `upload-artifact` silently excludes dot-directories unless
          # `include-hidden-files` is set, so `.vitest-reports/` uploaded nothing while the log
          # said "blob report written to …/.vitest-reports/blob-unit-2.json". Measured in CI.
          path: reports/vitest/
          retention-days: 3
          if-no-files-found: error

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Integration and contract tests
        env:
          COMVIVO_COVERAGE_THRESHOLDS: "off"
        run: >
          pnpm exec vitest run --project integration --project contract
          --coverage
          --reporter=blob
          --outputFile.blob=reports/vitest/blob-integration.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-integration
          path: reports/vitest/
          retention-days: 3
          if-no-files-found: error

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports/vitest
          pattern: blob-*
          merge-multiple: true

      - name: Merge reports and enforce thresholds
        run: pnpm exec vitest run --merge-reports=reports/vitest --coverage

      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            sed -n '1,12p' coverage/coverage-summary.json 2>/dev/null || echo '(no summary written)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 3
          if-no-files-found: warn

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            packages/*/dist
            apps/*/dist
          retention-days: 3
          if-no-files-found: error

  node24:
    name: node24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 is the supported floor (`01` §14 A1): native modules build there, so a host on the
      # previous LTS is not stranded. No coverage — this leg is about whether it runs, and the
      # thresholds are the Node 26 job's business.
      #
      # The **exact** floor, read from `package.json`. This passed `node-version: "24"`, which
      # `setup-node` resolves to the newest 24.x — measured as `v24.22.2` on a real run. So the
      # declared floor was never exercised, and a regression needing ≥ 24.12 would have been green
      # here and broken on a host actually running 24.11. Found by the M0 independent review.
      #
      # `engines.node` is the single source of truth, so raising the floor is one edit and this leg
      # follows it. `node` is preinstalled on the runner, before `setup-node` replaces it.
      - id: floor
        name: Read the supported Node floor from package.json
        run: |
          set -euo pipefail
          floor="$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g, '')")"
          echo "floor=${floor}" >> "$GITHUB_OUTPUT"
          echo "engines.node declares >= ${floor}"

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ steps.floor.outputs.floor }}

      - name: Check the floor is what is running
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -euo pipefail
          # Non-vacuous: if `setup-node` ever resolves something other than the declared floor, this
          # leg stops being about the floor, and the failure should say so rather than passing.
          running="$(node --version)"
          echo "running ${running}, floor v${FLOOR}"
          if [ "${running}" != "v${FLOOR}" ]; then
            echo "::error::this leg must run exactly v${FLOOR}, the floor engines.node declares," \
              "but it is running ${running}. Either setup-node resolved something else or" \
              "package.json changed." >&2
            exit 1
          fi

      # **Before** the tests, which is a change and the reason is the floor pin itself.
      #
      # Pinning this leg to the exact floor (it previously resolved to the newest 24.x) made four
      # `worker-connection.int.test.ts` cases fail on 24.11 with `Cannot find module
      # …/@comvivo/shared/dist/index.js`: `tsx`'s module-customization hooks do not reach inside a
      # `new Worker()` there, so the worker resolved the package through its `exports` map to a
      # `dist/` the leg had not built. The same test passes dist-free on Node 26 and on 24.22.
      #
      # Building first is the **more faithful** check, not a workaround: a host runs built
      # JavaScript, and `02` D22's worker read-connection claim is about the shipped artefact.
      # Running `tsx` inside a worker is a test convenience, and it is the convenience — not the
      # product — that needs a newer Node. So `engines.node >= 24.11.0` stays an honest promise.
      - name: Build on the supported Node floor
        run: pnpm run build

      - name: Tests on the supported Node floor
        run: pnpm exec vitest run --project unit --project integration --project contract

  changeset:
    name: changeset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check diffs against the merge base, which needs the base branch's history.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The job runs on every event but the check only applies to a pull request, so this is a
      # **step** condition rather than a job one. `ci-ok` treats any skipped job as a failure —
      # deliberately, because that is what stops a silently-skipped required check — so a job that
      # skipped itself on `push` would turn the aggregator red on `main`.
      - name: Changeset required?
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm run changeset:required

      - name: Not applicable
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "changeset: only checked on a pull request." >> "$GITHUB_STEP_SUMMARY"

  # The single required check (`11` §3.8.3). Branch protection names this and nothing else, so the
  # job list above can change without touching repository settings.
  #
  # `if: always()` plus an explicit audit of `needs`, because without the audit a skipped or
  # cancelled dependency leaves this job green — which is the failure mode that makes a required
  # check worthless.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs: [static, unit, integration, coverage, build, node24, changeset]
    if: ${{ always() }}
    steps:
      - name: Audit every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          # `node`, not `grep`: the previous version matched '"result": "failure"' with one literal
          # space, so a change in how GitHub formats `toJSON(needs)` would have made this count
          # zero failures and pass vacuously. GitHub does not document that formatting.
          counts=$(node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const results = Object.values(needs).map((job) => job.result);
            const bad = results.filter((r) => r === "failure" || r === "cancelled").length;
            const skipped = results.filter((r) => r === "skipped").length;
            const ok = results.filter((r) => r === "success").length;
            // Space-separated by console.log itself, not a template literal: a dollar-brace
            // inside this single-quoted script reads to shellcheck as a shell expansion.
            console.log(bad, skipped, ok, results.length);
          ')
          read -r failed skipped succeeded total <<< "$counts"
          echo "needed jobs: ${total} (ok ${succeeded}, failed ${failed}, skipped ${skipped})"
          if [ "$total" -eq 0 ]; then
            echo "ci-ok: no needed jobs reported, so nothing was checked." >&2
            exit 1
          fi
          if [ "$failed" -ne 0 ] || [ "$skipped" -ne 0 ]; then
            echo "ci-ok: ${failed} failed/cancelled and ${skipped} skipped job(s)." >&2
            echo "No job in ci.yml is skipped by design, so a skip means a dependency failed" >&2
            echo "earlier or the graph was edited without updating this audit." >&2
            exit 1
          fi
          echo "ci-ok: every needed job succeeded."
