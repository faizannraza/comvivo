# OpenSSF Scorecard (`08` §3.15).
#
# Tracked, not gated: target ≥ 8 by 1.0. Scorecard measures practices rather than code — branch
# protection, pinned dependencies, signed releases, token permissions, whether a fuzzer runs — so
# it is a useful outside read on whether this project's security posture is real or asserted.
#
# Weekly only. The score moves when repository settings or release practice change, not when code
# does, so running it per pull request would spend runner time to learn nothing.
name: scorecard

on:
  schedule:
    # 06:23 UTC Monday.
    - cron: "23 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Scorecard reads branch-protection and workflow settings to score them.
      actions: read
      # `publish_results` signs the result with a Sigstore certificate, which is what lets the
      # public badge be trusted rather than self-reported.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
          if-no-files-found: error

      - uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4
        with:
          sarif_file: results.sarif
