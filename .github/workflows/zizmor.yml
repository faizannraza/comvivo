# zizmor — static analysis of the workflows themselves (`08` §3.15).
#
# Runs on any change under `.github/`, which is where the blast radius lives: a workflow runs with a
# token, on this repository, with whatever secrets it can reach. zizmor knows the GitHub Actions
# threat model specifically — template injection, excessive permissions, credential persistence,
# cache poisoning, impostor commits — and finds the structural versions of problems that
# `workflow-policy.ts` only catches one line at a time.
#
# All three layers are deliberate and none replaces the others:
#   actionlint          syntax, expressions, runner labels, shellcheck over `run:` blocks
#   workflow-policy.ts  SHA pinning, `permissions: {}`, timeouts, `pull_request_target`
#   zizmor              the Actions threat model, with data flow
name: zizmor

# No `paths` filter on `pull_request`: a **workflow** that does not trigger reports no check at
# all, and `zizmor-ok` is a required check — an aggregator fixes job-level conditionality, not
# workflow-level triggering. A pull request touching nothing under `.github/` would otherwise
# block forever on a check that was never going to run. zizmor audits a handful of YAML files in
# seconds, so running it always costs nothing worth saving.
#
# `push` keeps the filter, because pushes to `main` are not gated on checks.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - ".github/**"

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The action uploads SARIF to the Security tab (`advanced-security` defaults to true).
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # `08` §3.15: block on high. Lower-severity findings still reach the Security tab, so
          # they are visible and triageable without gating every pull request on advice.
          min-severity: high

  # A stable check name for branch protection, for the same reason as `osv-ok`.
  #
  # `audit` now runs on **every** pull request and merge group — the `paths` filter came off that
  # trigger precisely because a workflow that does not start reports no check at all. So the
  # `skipped` branch below is unreachable today and is kept deliberately: if a `paths` filter is
  # ever restored, this aggregator must not pass with nothing audited, and the branch is where that
  # decision is written down.
  zizmor-ok:
    name: zizmor-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs: [audit]
    if: ${{ always() }}
    steps:
      - name: Audit the audit
        env:
          RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success)
              echo "zizmor-ok: the workflows are clean."
              ;;
            skipped)
              # Nothing under `.github/` changed, so there is nothing for zizmor to say.
              echo "zizmor-ok: no workflow changes in this pull request."
              ;;
            *)
              echo "zizmor-ok: the audit ${RESULT}." >&2
              exit 1
              ;;
          esac
