# Pull-request previews (`13` §3.C.2).
#
# Runs on `workflow_run`, after `docs.yml` has built the site **without any secret**. This is where
# the Cloudflare token lives, and by this point the only thing being handled is a static `dist/`
# directory produced by a job that had no credential.
#
# That inversion is the entire point. The obvious design — one workflow using
# `pull_request_target` so it can see the token — runs a fork's code with a writable token in the
# base repository's context, which is the textbook CI compromise. `scripts/hygiene/workflow-policy.ts`
# refuses `pull_request_target` outright so nobody can reach for it later.
name: docs-preview

on:
  workflow_run:
    workflows: [docs]
    types: [completed]

permissions: {}

concurrency:
  group: docs-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only for a pull request that built successfully. A failed build has nothing to deploy, and
    # deploying a partial site is worse than no preview.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: read
      # To leave the preview URL on the pull request. This is safe here and not in `docs.yml`:
      # this workflow runs code from the base branch, not from the fork.
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-pr-number
          path: meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: pr
        name: Read the pull-request number
        run: |
          set -euo pipefail
          number="$(tr -dc '0-9' < meta/pr-number)"
          if [ -z "$number" ]; then
            echo "docs-preview: no pull-request number in the artifact." >&2
            exit 1
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # The Cloudflare account and token are an owner action (H-9 in STATUS). Until they exist the
      # workflow reports that plainly instead of failing every pull request with a credentials
      # error, which would train everybody to ignore a red check.
      - id: guard
        name: Is Cloudflare configured?
        env:
          PROJECT: ${{ vars.DOCS_CLOUDFLARE_PROJECT }}
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -n "$PROJECT" ] && [ "$TOKEN_SET" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Docs preview not deployed"
              echo
              echo "The site built successfully — the artifact is attached to the \`docs\` run."
              echo
              echo "Cloudflare Pages is not configured yet: set the \`DOCS_CLOUDFLARE_PROJECT\`"
              echo "repository variable and the \`CLOUDFLARE_API_TOKEN\` secret. See H-9 in"
              echo "\`docs/plan/STATUS.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: deploy
        if: ${{ steps.guard.outputs.ready == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Direct upload, so the 500 builds/month free-plan limit is never touched — only deploys
          # are consumed (`13` §3.C.2).
          command: >-
            pages deploy dist
            --project-name=${{ vars.DOCS_CLOUDFLARE_PROJECT }}
            --branch=pr-${{ steps.pr.outputs.number }}

      - name: Comment the preview URL
        if: ${{ steps.guard.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          gh pr comment "$NUMBER" --edit-last --create-if-none --body "Docs preview: $URL"
