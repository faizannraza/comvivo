# OSV-Scanner (`08` §3.15).
#
# Two modes, and the distinction matters. On a pull request the reusable PR workflow scans the
# **diff**, so a vulnerability that already exists on `main` does not block unrelated work — which
# is what keeps the check from being routinely overridden. The nightly run scans the whole tree, so
# an advisory published today is found tomorrow without anybody touching the dependency.
#
# Triage lives in `osv-scanner.toml`, and every entry there carries an expiry date.
name: osv

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # 04:41 UTC daily. OSV records appear continuously; a dependency that was clean at merge time
    # is not clean forever.
    - cron: "41 4 * * *"

permissions: {}

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-pr:
    # The diff scan, on pull requests only.
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        --config=osv-scanner.toml
        ./

  scan-all:
    # The full scan: merge queue, `main`, and nightly.
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        --config=osv-scanner.toml
        ./

  # A stable check name for branch protection.
  #
  # `scan-pr` and `scan-all` are mutually exclusive by event: on a pull request only the diff scan
  # runs, in a merge group only the full scan does. Requiring either by name would stall the other
  # context forever — GitHub treats a required check that never reports as "pending", not as
  # "passed". Measured on a real push: `scan-all / osv-scan` succeeded and `scan-pr` was skipped.
  #
  # So branch protection requires THIS job, which always runs and audits the two above. Same
  # pattern as `ci-ok` in `ci.yml`, and for the same reason.
  osv-ok:
    name: osv-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs: [scan-pr, scan-all]
    if: ${{ always() }}
    steps:
      - name: Audit the scans
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          failed=$(echo "$NEEDS" | grep -c '"result": "\(failure\|cancelled\)"' || true)
          ran=$(echo "$NEEDS" | grep -c '"result": "success"' || true)
          if [ "$failed" -ne 0 ]; then
            echo "osv-ok: a scan failed." >&2
            exit 1
          fi
          if [ "$ran" -eq 0 ]; then
            echo "osv-ok: neither scan ran, so nothing was checked." >&2
            echo "One of scan-pr or scan-all must run for every event." >&2
            exit 1
          fi
          echo "osv-ok: ${ran} scan(s) succeeded."
