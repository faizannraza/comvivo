# Production deploy of the documentation site (`13` §3.C.2).
#
# Runs on `workflow_run` after `docs.yml` succeeds on `main`, so production never deploys a site
# that failed prose style, the links validator or the build.
#
# Cloudflare Pages rather than GitHub Pages: GitHub Pages has a 100 GB/month soft bandwidth limit,
# and direct upload means the free plan's 500 builds/month is never consumed because we build here.
name: docs-deploy

on:
  workflow_run:
    workflows: [docs]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: guard
        name: Is Cloudflare configured?
        env:
          PROJECT: ${{ vars.DOCS_CLOUDFLARE_PROJECT }}
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -n "$PROJECT" ] && [ "$TOKEN_SET" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Docs not deployed"
              echo
              echo "The site built successfully but Cloudflare Pages is not configured."
              echo "See H-9 in \`docs/plan/STATUS.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: ${{ steps.guard.outputs.ready == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.DOCS_CLOUDFLARE_PROJECT }}
            --branch=main
