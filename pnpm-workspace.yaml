# pnpm workspace definition and settings.
#
# Since pnpm 11, almost every setting lives HERE rather than in `.npmrc` — only auth, registry,
# TLS, proxy and `local-address` are still read from `.npmrc`.
#
# Specification: `docs/plan/08-security-privacy.md` §3.15 (dependency policy, supply chain) and
# `docs/plan/01-architecture.md` §14 A1 and A31 (runtime pins, the pnpm 11 settings relocation).
# Rationale for each native dependency: `docs/architecture/native-deps.md`.

packages:
  - "packages/*"
  - "!packages/channels"
  - "!packages/plugins"
  - "packages/channels/*"
  - "packages/plugins/*"
  - "apps/*"

# ---------------------------------------------------------------------------
# Runtime pin
# ---------------------------------------------------------------------------
# Fail rather than silently download a different pnpm when the client does not match
# `devEngines.packageManager`. Corepack is not bundled from Node 25 onward; pnpm does its own
# version switching, governed by this setting. `managePackageManagerVersions` and
# `packageManagerStrict` were removed in pnpm 11 (A31).
pmOnFail: error

# ---------------------------------------------------------------------------
# Supply chain (08 §3.15)
# ---------------------------------------------------------------------------
# Refuse any version — including transitive ones — published less than three days ago. This is the
# single most effective defence against a compromised-publish attack, because those are almost
# always caught within hours. The unit is MINUTES, and pnpm 11+ already defaults to 1440; 4320 is
# the three days `08` §3.15 asks for. Setting it explicitly also turns on strict mode.
minimumReleaseAge: 4320

# Emergency security bumps only. A PR adding an entry must link the advisory and carry two
# maintainer approvals, and the entry is removed once the version is three days old.
minimumReleaseAgeExclude: []

# Fail the install if a package's publish-trust level *decreases* against its earlier versions
# (trusted publisher → provenance-only → nothing). That drop is what a hijacked account looks like.
trustPolicy: no-downgrade

# Refuse dependencies that are not plain registry packages (git URLs, tarball URLs, local links in
# a published graph). `scripts/supply-policy.ts` (M0-T12) checks the lockfile for the same thing, so
# the rule holds even if a future pnpm renames this setting.
blockExoticSubdeps: true

# An install script that is neither allowed nor denied below is a hard error rather than a silent
# skip. This is the behaviour `08` §3.15 wanted and had to ask for explicitly; pnpm 11+ now
# defaults it to true, and it is restated here so a future default change cannot weaken it.
strictDepBuilds: true

# Packages permitted to run install scripts. Everything else is blocked.
#
# `onlyBuiltDependencies`, `neverBuiltDependencies`, `ignoredBuiltDependencies` and
# `ignoreDepScripts` were all REMOVED in pnpm 11 — this map replaces them (A31).
#
# Dependency facts: `12` §3.2.2, re-verified at implementation time. Full rationale and the
# pruning rules: `docs/architecture/native-deps.md`.
allowBuilds:
  # Its postinstall downloads the prebuilt Rust crypto binary for the platform. There is no
  # bundled alternative, and Matrix E2EE does not work without it. Arrives in M10.
  "@matrix-org/matrix-sdk-crypto-nodejs": true

  # DENIED. Its postinstall downloads the CUDA 12 execution provider from NuGet on linux/x64 —
  # roughly 190 MB of GPU runtime we never use, fetched from outside the npm registry. ONNX Runtime
  # already ships the CPU binaries we need inside the package, so denying the script costs nothing.
  # Belt and braces: `ONNXRUNTIME_NODE_INSTALL=skip` is set in CI and in the image.
  onnxruntime-node: false

  # Dev-only, reached through vite and tsx. Its postinstall links the prebuilt platform binary that
  # ships as an optional dependency; without it the bundler cannot start. Never shipped to users.
  # This entry is an addition to `08` §3.15's original list — see STATUS → Plan changes.
  esbuild: true

  # NOT listed, deliberately, because they need no build script:
  #   better-sqlite3-multiple-ciphers  ships bundled N-API prebuilds for every target
  #   sqlite-vec                        a loadable extension, ABI-free, per-platform optional deps
  #   sharp                             optional platform packages, no script

# ---------------------------------------------------------------------------
# Shared dependency versions
# ---------------------------------------------------------------------------
# Referenced from packages as `"vitest": "catalog:"`. One place to bump.
# --- Security overrides -------------------------------------------------------------------------
# Transitive dependencies forced to a patched version because the direct dependency has not
# released a fix. Each entry needs the advisory, what the vulnerability is, and why this specific
# version. Remove an entry the moment the parent ships a range that covers it.
#
# OSV-Scanner found both of these on the first run of `osv.yml` (M0-T12), which is the clearest
# evidence the workflow does what it claims.
overrides:
  # GHSA-w5hq-g745-h8pq - missing buffer bounds check in uuid v3/v5/v6 when `buf` is provided.
  # Vulnerable `< 11.1.1`; `typeid-js@1.2.0` is the latest release and pins `uuid: ^10.0.0`, so
  # there is no upstream fix to wait for.
  #
  # This one SHIPS: `typeid-js` is a runtime dependency of `@comvivo/shared`, so the code reaches a
  # host's machine. 11.1.1 rather than the current 14.x because it is the smallest patched step -
  # `typeid-js` was written against uuid 10's API, and jumping three majors would risk breaking id
  # generation for no additional security. The cross-checks in `deterministic-ids.test.ts` parse
  # our ids with typeid-js's own parser, so a behavioural change fails the suite rather than ships.
  uuid: ^11.1.1
  # GHSA-g3hv-75wg-m249 - denial of service via glob-parts amplification. Vulnerable `< 11.0.1`.
  # Reached only through the eslint toolchain, so it is dev-only: a linter that can be slowed down
  # by a crafted glob is not a product risk. Fixed anyway, because the fix is a version bump.
  minimatch: ^11.0.1
  # GHSA-67mh-4wv8-2f99 - esbuild's development server sets `Access-Control-Allow-Origin: *`, so
  # any website a developer visits can make requests to it and read the responses. Vulnerable
  # `< 0.25.0`; `drizzle-kit@0.31.11` pins `esbuild ^0.18.20` and has no release that moves off it.
  #
  # Dev-only and, for us, not even that: drizzle-kit uses esbuild's **bundle** API to compile
  # `drizzle.config.ts`, and never starts a server. It is overridden anyway, because the fix is a
  # version bump and because leaving a known advisory in the lockfile trains people to read
  # `osv-scanner` output as noise. `0.25.x` was already in the tree through vite and tsx, so this
  # also collapses two copies of esbuild into one.
  esbuild: ^0.25.0

catalog:
  fast-check: ^4.10
  # --- storage (M1) -----------------------------------------------------------------------------
  # Pinned EXACTLY, per `02` M1-T1. Not a style choice: a SQLite build, a loadable extension and a
  # crypto library are the three places where a silent patch bump can change bytes on disk or on
  # the wire. Renovate opens a PR for each (grouped, `minimumReleaseAge: 3 days`, no auto-merge),
  # so an upgrade is a reviewed diff with the spike suite re-run rather than an install-time
  # surprise. Versions re-verified against the registry on 2026-11-03 (`CLAUDE.md` §6).
  better-sqlite3-multiple-ciphers: 13.0.3
  sqlite-vec: 0.1.9
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  libsodium-wrappers: 0.8.4
  tar-stream: 3.2.2
  # Not shipped. `02` D13 makes `libsodium-wrappers` (WASM) the default and `sodium-native` the
  # fallback **only if** SP-2 measures < 40 MB/s on a Pi 5 — and claims the switch is wire-
  # identical. That claim is worth exactly nothing untested, so `M1-T4` keeps this as a
  # devDependency of `@comvivo/shared` and cross-decrypts between the two implementations in both
  # directions. No install script and no compiler: it loads a prebuilt addon via `require-addon`.
  sodium-native: 5.2.0
  pino: ^10.4
  pure-rand: ^8.4
  typeid-js: ^1.2
  zod: ^4.6
  yaml: ^2.9
  # Exact, per `02` M1-T1: `Instant`/`PlainDate`/`ZonedDateTime` are **persisted** (`02` §3.1
  # column helpers), so a polyfill patch that changes a string form changes what is in a host's
  # database. 1.0.7 exists as of 2026-11-04 and is younger than `minimumReleaseAge`.
  temporal-polyfill: 1.0.6
  vitest: ^5.0
  "@vitest/coverage-v8": ^5.0
  "@types/node": ^24.9
  typescript: 6.0.3
